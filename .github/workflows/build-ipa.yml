name: Build Unsigned IPA for Sideloadly

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile iOS App
    runs-on: macos-15
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16.1 & Install iOS Platform
        run: |
          sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          sudo xcodebuild -runFirstLaunch
          sudo xcodebuild -downloadPlatform iOS

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run Expo iOS Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Configure Node for Xcode & Install CocoaPods
        run: |
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
          cd ios
          pod install --repo-update
          cd ..

      - name: Build Ad-Hoc Xcode Project
        run: |
          SCHEME_NAME=$(xcodebuild -workspace ios/*.xcworkspace -list | awk '/Schemes:/{flag=1;next} flag{print $1;exit}')
          echo "Detected scheme: $SCHEME_NAME"
          xcodebuild -workspace ios/*.xcworkspace \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app build/Payload/
          cd build
          zip -r acid-sys.ipa Payload/
          mv acid-sys.ipa ../

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: acid-sys-ipa
          path: mobile/acid-sys.ipa
