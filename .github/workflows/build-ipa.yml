name: Build Unsigned IPA for Sideloadly

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile iOS App
    runs-on: macos-15
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode & Install iOS Platform
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selected Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          sudo xcodebuild -runFirstLaunch
          sudo xcodebuild -downloadPlatform iOS

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Downgrade Swift Tools Version
        run: |
          find node_modules -type f -name "Package.swift" -exec sed -i '' 's/swift-tools-version: 6.2/swift-tools-version: 6.0/g' {} +

      - name: Patch Expo JSI Header
        run: |
          find node_modules -name "RuntimeScheduler.h" -exec sed -i '' 's/SWIFT_RETURNS_RETAINED RuntimeScheduler/RuntimeScheduler/g' {} +

      - name: Run Expo iOS Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Configure Podfile & CocoaPods
        run: |
          mkdir -p ios
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
          ruby -e '
            file = "ios/Podfile"
            if File.exist?(file)
              content = File.read(file)
              snippet = %Q{
                installer.pods_project.targets.each do |target|
                  target.build_configurations.each do |config|
                    config.build_settings["SWIFT_STRICT_CONCURRENCY"] = "minimal"
                    config.build_settings["SWIFT_VERSION"] = "5.0"
                  end
                end
              }
              if content.include?("post_install do |installer|")
                content.sub!("post_install do |installer|", "post_install do |installer|\n" + snippet)
                File.write(file, content)
              end
            end
          '
          cd ios
          pod install --repo-update
          cd ..

      - name: Build Ad-Hoc Xcode Project
        run: |
          SCHEME_NAME=$(xcodebuild -workspace ios/*.xcworkspace -list | awk '/Schemes:/{flag=1;next} flag{print $1;exit}')
          echo "Detected scheme: $SCHEME_NAME"
          xcodebuild -workspace ios/*.xcworkspace \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            SWIFT_STRICT_CONCURRENCY=minimal \
            SWIFT_VERSION=5.0 \
            build

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app build/Payload/
          cd build
          zip -r acid-sys.ipa Payload/
          mv acid-sys.ipa ../

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: acid-sys-ipa
          path: mobile/acid-sys.ipa
