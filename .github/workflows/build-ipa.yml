name: Build Unsigned IPA for Sideloadly

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile iOS App
    runs-on: macos-15
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode & Install iOS Platform
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Selected Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          sudo xcodebuild -runFirstLaunch
          sudo xcodebuild -downloadPlatform iOS

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Patch Expo JSI Header (if needed)
        run: |
          # Only patch if RuntimeScheduler.h exists and truly needs patching
          RUNTIME_SCHEDULER=$(find node_modules -name "RuntimeScheduler.h" -type f | head -1)
          if [ -n "$RUNTIME_SCHEDULER" ]; then
            if grep -q "SWIFT_RETURNS_RETAINED RuntimeScheduler" "$RUNTIME_SCHEDULER"; then
              sed -i '' 's/SWIFT_RETURNS_RETAINED RuntimeScheduler/RuntimeScheduler/g' "$RUNTIME_SCHEDULER"
              echo "Patched RuntimeScheduler.h"
            fi
          else
            echo "RuntimeScheduler.h not found - skipping patch"
          fi

      - name: Run Expo iOS Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Configure Podfile & CocoaPods
        run: |
          mkdir -p ios
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
          ruby -e '
            file = "ios/Podfile"
            if File.exist?(file)
              content = File.read(file)
              
              if content.include?("post_install do |installer|")
                snippet = %Q{
                  # Configure all pods except ExpoModulesJSI
                  installer.pods_project.targets.each do |target|
                    next if target.name == "ExpoModulesJSI"
                    
                    target.build_configurations.each do |config|
                      config.build_settings["SWIFT_STRICT_CONCURRENCY"] = "minimal"
                      config.build_settings["SWIFT_VERSION"] = "5.9"
                      config.build_settings["GCC_WARN_INHIBIT_ALL_WARNINGS"] = "YES"
                    end
                  end
                }
                
                content.sub!("post_install do |installer|", "post_install do |installer|\n" + snippet)
                File.write(file, content)
                puts "✅ Updated Podfile with Swift configuration"
              end
            end
          '
          cd ios
          pod install --repo-update
          cd ..

      - name: Build Ad-Hoc Xcode Project
        run: |
          SCHEME_NAME=$(xcodebuild -workspace ios/*.xcworkspace -list | awk '/Schemes:/{flag=1;next} flag{print $1;exit}')
          echo "Detected scheme: $SCHEME_NAME"
          
          # Disable exit-on-error so we can manually catch the pipe failure
          set +e
          
          # Build without aggressive Swift/warning suppression that may cause ExpoModulesJSI issues
          xcodebuild -workspace ios/*.xcworkspace \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee build.log
          
          BUILD_EXIT=${PIPESTATUS[0]}
          
          # Validate the build actually succeeded
          if [ $BUILD_EXIT -ne 0 ]; then
            echo ""
            echo "❌ Build failed with exit code $BUILD_EXIT"
            echo ""
            echo "=== Searching for ExpoModulesJSI script errors ==="
            grep -A 20 "ExpoModulesJSI" build.log | head -40 || echo "No ExpoModulesJSI details found"
            echo ""
            echo "=== Last 100 lines of build output ==="
            tail -n 100 build.log
            exit 1
          fi
          
          # Verify the app bundle exists
          if ! find ios/build/Build/Products/Release-iphoneos -name "*.app" -type d -exec test -f '{}/Info.plist' \; -print | head -n 1 | grep -q .; then
            echo "❌ Build completed but no valid .app bundle generated!"
            find ios/build/Build/Products/Release-iphoneos -type d -name "*.app" | head -5
            exit 1
          fi
          
          echo "✅ Build succeeded and app bundle found"

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          
          # 1. Dynamically locate the true app bundle (the one containing Info.plist)
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -type d -exec test -f '{}/Info.plist' \; -print | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Error: Valid .app bundle with Info.plist not found in Release-iphoneos!"
            echo "Falling back to exhaustive search across all derived data:"
            APP_PATH=$(find ios/build -name "*.app" -type d -exec test -f '{}/Info.plist' \; -print | head -n 1)
            if [ -z "$APP_PATH" ]; then
              echo "Fatal: No complete .app bundle found anywhere!"
              exit 1
            fi
          fi
          
          echo "Found true compiled app bundle at: $APP_PATH"
          
          # 2. Use ditto (Apple's native tool) to preserve all bundle metadata and structure perfectly
          ditto "$APP_PATH" "build/Payload/$(basename "$APP_PATH")"
          
          # 3. Compress the Payload directory into an IPA using ditto instead of standard zip
          cd build
          ditto -c -k --keepParent Payload acid-sys.ipa
          mv acid-sys.ipa ../

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: acid-sys-ipa
          path: mobile/acid-sys.ipa
